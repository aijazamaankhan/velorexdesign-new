<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Wellness — Ayurvedic wood">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c2a1a"/>
      <stop offset="0.55" stop-color="#5b3d22"/>
      <stop offset="1" stop-color="#2c1d10"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4b"/>
      <stop offset="0.5" stop-color="#a96a32"/>
      <stop offset="1" stop-color="#7d4a20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#00d4aa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00d4aa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#glow)"/>

  <!-- soft ground shadow -->
  <ellipse cx="200" cy="252" rx="86" ry="14" fill="#000" opacity="0.28"/>

  <!-- wooden tumbler -->
  <g>
    <rect x="158" y="92" width="84" height="150" rx="18" fill="url(#wood)" stroke="#5b3416" stroke-width="2"/>
    <path d="M158 116 q42 12 84 0" fill="none" stroke="#dcae79" stroke-width="2" opacity="0.7"/>
    <path d="M158 124 q42 12 84 0" fill="none" stroke="#dcae79" stroke-width="2" opacity="0.5"/>
    <path d="M158 214 q42 12 84 0" fill="none" stroke="#dcae79" stroke-width="2" opacity="0.7"/>
    <path d="M158 222 q42 12 84 0" fill="none" stroke="#dcae79" stroke-width="2" opacity="0.5"/>
    <!-- base -->
    <ellipse cx="200" cy="246" rx="46" ry="11" fill="#8a5527" stroke="#5b3416" stroke-width="2"/>
    <!-- highlight -->
    <rect x="170" y="100" width="14" height="134" rx="7" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- leaf sprig -->
  <g transform="translate(250 70)" fill="#3a8a4a">
    <path d="M0 40 C 0 10 22 -6 44 -10 C 40 16 22 36 0 40 Z"/>
    <path d="M0 40 C 0 64 -20 84 -42 90 C -40 62 -20 44 0 40 Z" fill="#2f7a3f"/>
    <path d="M2 38 C 18 22 34 8 46 -8" stroke="#1f5a2c" stroke-width="2" fill="none"/>
    <path d="M-2 42 C -16 58 -30 74 -42 88" stroke="#1f5a2c" stroke-width="2" fill="none"/>
  </g>

  <!-- small accent leaves bottom-left -->
  <g transform="translate(96 196) rotate(-18)" fill="#3a8a4a" opacity="0.9">
    <path d="M0 18 C 0 2 14 -8 30 -10 C 27 8 14 18 0 18 Z"/>
  </g>
</svg>
